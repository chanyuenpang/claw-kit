name: 平台适配问题 / Platform adapter issue
description: 某个宿主上安装、初始化或第一次会话卡住了。Report a platform that got stuck during install, claw init, or the first agent session.
title: "平台适配问题 / Platform adapter issue"
labels:
  - platform
body:
  - type: markdown
    attributes:
      value: |
        请用这个表单报告某个平台上的问题。日志里请去掉密钥和隐私内容。

        Use this form for a problem on one platform. Remove secrets and private data from logs.
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      description: 你在哪个宿主上遇到问题。Which host you were using.
      options:
        - DeepSeek Harness (dsh)
        - Codex
        - OpenCode
        - Cindy
        - Claude Code (standard/universal)
        - Other
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: 宿主版本 / Host version
      description: 宿主应用或 CLI 的版本。The host app or CLI version.
      placeholder: 例如 / e.g. Codex 0.x, dsh 1.x, Claude Code 2.x
    validations:
      required: true
  - type: input
    id: claw-version
    attributes:
      label: claw-kit 版本 / claw-kit version
      description: 运行 `claw --version` 的输出。Output of `claw --version`.
      placeholder: 0.2.51
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统 / OS
      description: 系统名称和版本。Operating system and version.
      placeholder: 例如 / e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: stuck-step
    attributes:
      label: 卡在哪一步 / Which step got stuck
      description: 最接近失败的那一步。The step closest to the failure.
      options:
        - install / 安装
        - claw init
        - agent first session / 第一次会话
        - other / 其他
    validations:
      required: true
  - type: textarea
    id: happened-vs-expected
    attributes:
      label: 实际 vs 预期 / What happened vs expected
      description: 写清实际发生了什么，以及你预期会怎样。Say what happened, then what you expected.
      placeholder: |
        实际 / What happened:

        预期 / Expected:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 贴出相关日志或报错。去掉 token、密钥和隐私路径。Paste relevant logs or errors. Remove tokens, secrets, and private paths.
      render: text
    validations:
      required: false
