# The claw-kit dsh bundle: one host row mounting the claw-kit plugin.
#
# Install into a profile with:
#   dsh plugin --profile <name> add @veewo/dsh-claw-kit
# then restart the Host. The row registers the claw_run tool and the
# session-start lifecycle hook; per-session tool presence is
# controlled by an agent preset that names this row (or by the process-wide
# composition when a TUI profile mounts it).
- insert:
    - id: claw-kit
      name: '@veewo/dsh-claw-kit'
